<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Climate · CO₂ — 47 ans, 21 variables</title>
  <meta name="description" content="Dashboard scientifique cinématique : 47 ans de climat global et CO₂ atmosphérique. 21 variables NOAA/CFSR · 5 représentations · 4 hotspots." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Three.js -->
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

  <!-- App scripts (order matters) -->
  <script type="text/babel" data-presets="env,react" src="src/data.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/ui.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/earth-geo.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/three-utils.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/sections/hero.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/sections/trajectory.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/sections/earth3d.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/sections/link.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/sections/hotspots.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/sections/critical.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="src/app.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    // Wait for all babel scripts to be transpiled and executed
    const tryMount = () => {
      if (!window.App) { setTimeout(tryMount, 50); return; }
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    };
    tryMount();
  </script>
</body>
</html>
